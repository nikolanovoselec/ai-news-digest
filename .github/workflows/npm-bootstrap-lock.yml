name: Prepare dependency security lock

on:
  push:
    branches: [ci/npm-bootstrap-lock]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - name: Install the locked npm bootstrap
        run: bash .github/scripts/setup-npm.sh
      - name: Generate and verify the patched application lock
        run: |
          set -euo pipefail
          npm install --package-lock-only --no-fund --no-audit
          npm ci --no-fund --no-audit
          npm audit --json | tee application-audit.json
          npm ls glob minimatch --all > dependency-tree.txt
      - name: Build the application
        run: npm run build
      - name: Verify built client assets remain precached
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { getManifest } from 'workbox-build';
          const files = await readdir('dist/client', { recursive: true });
          const expected = files.filter(path => /^(?:_astro|scripts)\/.*\.(?:js|css)$/.test(path));
          assert(expected.length > 0, 'Built client JS/CSS assets must exist');
          const { manifestEntries, warnings } = await getManifest({
            globDirectory: 'dist/client',
            globPatterns: ['**/*.{js,css,html,wasm}'],
            globIgnores: ['sw.js', 'workbox-*.js'],
          });
          const urls = new Set(manifestEntries.map(entry => decodeURIComponent(entry.url).replace(/^\//, '')));
          const sw = await readFile('dist/client/sw.js', 'utf8');
          for (const path of expected) {
            assert(urls.has(path), `Workbox manifest omitted ${path}`);
            assert([path, `/${path}`].some(url => sw.includes(JSON.stringify(url)) || sw.includes(`'${url}'`)),
              `Generated service worker omitted ${path}`);
          }
          await writeFile('pwa-precache-check.json', JSON.stringify({ expected, manifestEntries, warnings }, null, 2));
          console.log(`Verified ${expected.length} built client assets in ${manifestEntries.length} precache entries`);
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-security-lock
          path: |
            package.json
            package-lock.json
            application-audit.json
            dependency-tree.txt
            pwa-precache-check.json
            dist/client/sw.js
          if-no-files-found: error
          retention-days: 1
