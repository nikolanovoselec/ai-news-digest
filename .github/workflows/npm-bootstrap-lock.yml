name: Prepare npm bootstrap lock

on:
  push:
    branches: [ci/npm-bootstrap-lock]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - name: Generate and validate bootstrap lock with bundled npm
        run: |
          set -euo pipefail
          npm --version
          npm install --prefix .github/npm --package-lock-only --ignore-scripts --no-fund --no-audit
          npm ci --prefix .github/npm --ignore-scripts --no-fund --no-audit
          version=$(.github/npm/node_modules/.bin/npm --version)
          expected=$(node -p "require('./.github/npm/package.json').dependencies.npm")
          test "$version" = "$expected"
          printf 'Locked npm bootstrap: %s\n' "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-bootstrap-lock
          path: .github/npm/package-lock.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
