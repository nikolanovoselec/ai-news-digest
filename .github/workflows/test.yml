name: PR Checks
# Fires on:
#   - push to develop (fast feedback on work-in-progress)
#   - push to main (post-merge regression gate; deploy fires only on green)
#   - pull_request targeting main OR develop (pre-merge gate)
#   - workflow_dispatch (manual re-run)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'

      - name: Use integrity-pinned npm resolver
        run: bash .github/scripts/setup-npm.sh

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      # CF-048 / AD28 — audit the production-dep tree at TWO levels:
      #   - HIGH+: visible in CI logs (continue-on-error) so operators
      #     see Dependabot triage candidates on every push without
      #     blocking the build on transitive-only CVEs.
      #   - CRITICAL+: blocking. Real production-runtime exposure is
      #     gated here.
      # Why this split: @astrojs/cloudflare is a production dep that
      # transitively pulls miniflare/wrangler/undici. Those tools run
      # at build/dev time only; the deployed Workers bundle runs on
      # workerd which uses its own fetch, NOT undici. A HIGH undici
      # CVE in node_modules has no production attack surface but
      # would block every PR. The repo's Dependabot channel resolves
      # those transitives over time. AD28 records why HIGH does not
      # block; do not re-tighten without checking transitive scope
      # against workerd runtime first.
      - name: npm audit (production deps, high+ - advisory only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: npm audit (production deps, critical+ - blocking)
        run: npm audit --omit=dev --audit-level=critical

      # Include development tooling without changing the production gate.
      - name: npm audit (all deps, advisory only)
        run: npm audit
        continue-on-error: true

      - name: Lint
        run: npm run lint

      # CF-069 — fail the build when source/tests/docs reference a REQ
      # id that doesn't exist in sdd/. Catches drift between docs +
      # SDD spec ahead of doc-updater's per-push pass.
      - name: REQ backlink coverage
        run: node scripts/check-req-backlinks.mjs

      # CF-016 — wrangler.toml [vars] and [env.integration.vars] must
      # share the same key set so a missing variable can't silently
      # change behavior on one env but not the other.
      - name: Wrangler vars parity (prod vs integration)
        run: node scripts/check-wrangler-vars-parity.mjs

      # AD20 — fail the build if any src/pages/** or src/components/**
      # statically imports a top-level src/scripts/*.ts file. That
      # double-bundles the script (standalone IIFE + page chunk),
      # which silently registered duplicate document-level listeners
      # and broke favourite toggles in PRs #182/#184/#185.
      - name: Pattern B import discipline (AD20)
        run: node scripts/check-no-page-pattern-b.mjs

      - name: Dead code check
        run: npm run knip

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify built deployment target
        run: node scripts/check-deploy-config.mjs

      - name: Tests
        run: npm test

  # Temporary exact-commit verification; no publication or SARIF upload.
  pinned-dependencies-probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    name: Verify dependency pinning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check exact develop commit with Scorecard v5.6.0
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d "$RUNNER_TEMP/scorecard.XXXXXX")
          archive="$tool_dir/scorecard.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --max-time 120 \
            https://github.com/ossf/scorecard/releases/download/v5.6.0/scorecard_5.6.0_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '19bde07129450cb65a95c6e3b9f34e034341579e6f0e241546ec3ae6efb2dd9a' \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir"
          result="$RUNNER_TEMP/pinned-dependencies.json"
          "$tool_dir/scorecard" \
            --repo="github.com/$GITHUB_REPOSITORY" --commit="$GITHUB_SHA" \
            --checks=Pinned-Dependencies --format=json --show-details --output="$result"
          cat "$result"
          jq -e --arg sha "$GITHUB_SHA" '
            .repo.commit == $sha
            and (.checks | length == 1)
            and .checks[0].name == "Pinned-Dependencies"
            and .checks[0].score == 10
          ' "$result"
