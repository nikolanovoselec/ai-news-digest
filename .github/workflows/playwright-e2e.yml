name: Playwright E2E (live)
# Live-site smoke suite. Runs against the integration Worker configured
# by that environment's APP_URL and exercises behaviours that vitest
# cannot validate — real browser layout, view-transition snapshots,
# scroll restore, the click-to-morph contract, and the single-named-
# group invariant on /digest and /history.
#
# Triggered manually (workflow_dispatch). Optional `base_url` input must
# match the configured integration origin. The synthetic `__e2e__` user (provisioned
# by migrations/0006_e2e_user.sql) owns every mutation; the operator's
# real account is never touched.
#
# Uses integration-environment `DEV_BYPASS_TOKEN` (with GitHub's standard
# repository fallback), matching the integration Worker's secret.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Integration URL (defaults to environment APP_URL; same origin required)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  e2e:
    name: Live view-transition smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: integration
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate integration target
        id: target
        env:
          APP_URL: ${{ vars.APP_URL }}
          REQUESTED_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          bash .github/scripts/validate-app-url.sh "$APP_URL" "vars.APP_URL"
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const configured = new URL(process.env.APP_URL);
          const requested = new URL(process.env.REQUESTED_URL || process.env.APP_URL);
          for (const url of [configured, requested]) {
            if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash || url.pathname !== '/') {
              throw new Error('Integration target must be an HTTPS origin without credentials, path, query, or fragment');
            }
          }
          if (requested.origin !== configured.origin) {
            throw new Error('base_url must match the configured integration APP_URL origin');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `base_url=${configured.origin}\n`);
          NODE

      # Keep the installer aligned with PR Checks' fixed peer resolver.
      - name: Use fixed npm resolver
        run: |
          npm install --global npm@12.2.0 --no-fund --no-audit
          npm --version

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.target.outputs.base_url }}
          PLAYWRIGHT_DEV_BYPASS_TOKEN: ${{ secrets.DEV_BYPASS_TOKEN }}
          CI: 'true'
        # Session cookies must not enter downloadable failure traces.
        run: |
          : "${PLAYWRIGHT_DEV_BYPASS_TOKEN:?Integration DEV_BYPASS_TOKEN is required}"
          npm run test:e2e -- --trace off

      - name: Upload Playwright screenshots and report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
